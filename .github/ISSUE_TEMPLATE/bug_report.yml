name: Bug report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include steps to reproduce and your environment.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to server X
        2. Open tool Y
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Zvia version
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Desktop platform
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: remote
    attributes:
      label: Remote server OS (optional)
      placeholder: e.g. Ubuntu 24.04
