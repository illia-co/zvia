appId: com.zvia.app
productName: Zvia
executableName: zvia
electronVersion: "44.0.0"
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - dmg
  artifactName: zvia-mac.${ext}
  # Unsigned open-source builds. hardenedRuntime requires a Developer ID certificate;
  # enabling it without one produces a broken signature that macOS reports as "damaged".
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
win:
  icon: build/icon.png
  target:
    - nsis
  artifactName: zvia-win.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
  artifactName: zvia-linux.${ext}
  category: Development
  syncDesktopName: true
