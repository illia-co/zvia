name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: dist:mac
            file: app/release/zvia-mac.dmg
          - os: windows-latest
            command: dist:win
            file: app/release/zvia-win.exe
          - os: ubuntu-latest
            command: dist:linux
            file: app/release/zvia-linux.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build distributable
        run: npm run ${{ matrix.command }} -w @zvia/app

      - name: Verify installer
        shell: bash
        run: test -f "${{ matrix.file }}"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.file }}
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find installers -name 'zvia-mac.dmg' -exec cp -f {} release-assets/ \;
          find installers -name 'zvia-win.exe' -exec cp -f {} release-assets/ \;
          find installers -name 'zvia-linux.AppImage' -exec cp -f {} release-assets/ \;
          ls -la release-assets
          test "$(ls -1 release-assets | wc -l)" -eq 3

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/zvia-mac.dmg
            release-assets/zvia-win.exe
            release-assets/zvia-linux.AppImage
