appId: com.relay.app
productName: Relay
electronVersion: "44.0.0"
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Development
