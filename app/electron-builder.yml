appId: com.zvia.app
productName: Zvia
electronVersion: "44.0.0"
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - dmg
  artifactName: Zvia-mac.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  icon: build/icon.png
  target:
    - nsis
  artifactName: Zvia-windows-setup.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
  artifactName: Zvia-linux.${ext}
  category: Development
